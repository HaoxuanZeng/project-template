[package]
name = "project-template"
version = "0.1.0"
edition = "2024"
include = ["src/**/*"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
env_logger = "0.11.11"
hoomd-workspace = "1.4.0"
log = "0.4.35"
serde = "1.0.229"
serde_json = "1.0.154"



[[bin]]
name = "populate_workspace"
path = "workflow/bin/populate_workspace.rs"

[[bin]]
name = "actions"
path = "workflow/bin/actions.rs"

